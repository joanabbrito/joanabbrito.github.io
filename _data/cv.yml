cv:
  name: Joana Brito
  label: PhD Student in Computer Science & Engineering
  email: joana.b.brito@tecnico.ulisboa.pt
  location: Lisbon, Portugal
  image: ""
  summary: PhD student and researcher at GAIPS (INESC-ID), Instituto Superior Técnico, working on assistive robots that give cognitive support while preserving people's sense of autonomy. My research spans human-robot interaction and assistive technology, with a focus on autonomy, cognitive support, and executive functions. Background in biomedical engineering and physiological computing. Part of the lab's social media team, engaged in science communication to share its research with the public.

