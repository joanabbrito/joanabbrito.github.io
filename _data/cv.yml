    Publications:
      - title: Unlocking Emotions: The Impact of Robot Question-Asking and Reciprocal Sharing on Self-Disclosure during Emotion Learning
        authors:
          - Joana Brito
          - Anouk Neerincx
          - Antonio Soares
          - Haohua Dong
          - Ana Teresa Antunes
          - Ana Paiva
          - Maartje deGraaf
          - Joana Campos
        publisher: ACM/IEEE International Conference on Human-Robot Interaction (HRI) 2026
        releaseDate: In press
        url: https://humanrobotinteraction.org/2026/
        summary: We show that a social robot that actively prompts reflection can meaningfully increase children’s emotional self-disclosure and engagement during play, offering design insights for fostering emotional skills through child–robot interaction.

      - title: Assistant Robots with an Agenda foster Uncooperative Behaviors
        authors:
          - Joana Brito
          - Regina de Brito Duarte
          - Henrique C. Fonseca
          - Joana Campos
          - Filipa Correia
          - Ana Paiva
        publisher: 2025 25th IEEE international symposium on robot and human interactive communication (RO-MAN)
        releaseDate: 2025-11-03
        url: https://ieeexplore.ieee.org/abstract/document/11217891
        summary: We demonstrate that assistant robots expressing prosocial or self-serving goals can unexpectedly reduce cooperation in a Public Goods Game, revealing how a robot’s perceived motives shape trust, discomfort, and group dynamics.

